<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meowcoco | 你的名字</title>
<style>
  .modal {
    display: none; 
    position: fixed; 
    z-index: 999; 
    top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(0,0,0,0.85); 
    justify-content: center; align-items: center;
  }
  .modal img { max-width: 95%; max-height: 90%; border-radius: 8px; }
  .modal.active { display: flex; cursor: zoom-out; }
</style>
<style>
:root {
  --bg: #FFF9F0;        /* 温暖奶油背景 */
  --card: #FFFFFF;      /* 纯白卡片 */
  --text: #4A3B32;      /* 深咖啡色文字 */
  --muted: #8E7D72;     /* 浅灰褐色描述文字 */
  --accent: #FF9E9E;    /* 猫爪粉，用于按钮 */
  --accent-hover: #F88B8B; /* 悬停时加深一点的粉色 */
  --border: #F0E6D6;    /* 柔和边框 */
  --shadow: 0 8px 24px rgba(255, 158, 158, 0.15); /* 粉色柔光阴影 */
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

header {
  padding: 60px 20px 40px;
  text-align: center;
}

header h1 {
  margin: 0 0 12px;
  font-size: 2.2rem;
  color: var(--text);
  letter-spacing: 1px;
}

header h1::after {
  content: " 🐾";
  font-size: 1.8rem;
}

header p {
  margin: 0;
  color: var(--muted);
  font-size: 1.1rem;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px 80px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 24px;
}

.card {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 24px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow: var(--shadow);
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 16px 32px rgba(255, 158, 158, 0.25);
}

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  background: #FDF6EE;
  display: block;
}

.card-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.card h2 {
  font-size: 1.2rem;
  margin: 0 0 8px;
}

.card p {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 0.95rem;
  flex: 1;
}

.price {
  font-weight: 800;
  font-size: 1.15rem;
  color: var(--accent);
  margin-bottom: 16px;
}

.btn {
  display: inline-block;
  text-align: center;
  padding: 12px 20px;
  background: var(--accent);
  color: #fff;
  text-decoration: none;
  border-radius: 50px;
  font-weight: 700;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(255, 158, 158, 0.3);
}

.btn:hover {
  background: var(--accent-hover);
  transform: scale(1.02);
}

.contact {
  margin-top: 60px;
  padding: 40px 20px;
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 24px;
  text-align: center;
  box-shadow: var(--shadow);
}

.contact h2 {
  margin-top: 0;
  color: var(--text);
}

.contact-links {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-top: 20px;
}

.contact-links a {
  display: inline-block;
  padding: 12px 24px;
  border: 2px solid var(--border);
  border-radius: 50px;
  text-decoration: none;
  color: var(--text);
  background: #FFFDF9;
  font-weight: 600;
  transition: all 0.2s ease;
}

.contact-links a:hover {
  background: var(--bg);
  border-color: var(--accent);
  color: var(--accent);
}

footer {
  text-align: center;
  padding: 24px 20px 60px;
  color: var(--muted);
  font-size: 0.9rem;
}
</style>
</head>
<body>

<header>
  <h1>Meowcoco</h1>
  <p>看中哪个直接联系我购买</p>
</header>

<div class="container">
  <div class="products">
    
  <!-- 分类一：甜点区 -->
  <div style="grid-column: 1 / -1;">
    <h2 style="color: var(--accent); margin: 20px 0 10px; border-bottom: 2px dashed var(--border); padding-bottom: 10px;">🍰 甜点系列</h2>
  </div>

  <!-- 这里放甜点的卡片（复制之前的card代码） -->
  <div class="card"> ... </div>

  <!-- 分类二：饮品区 -->
  <div style="grid-column: 1 / -1;">
    <h2 style="color: var(--accent); margin: 40px 0 10px; border-bottom: 2px dashed var(--border); padding-bottom: 10px;">☕ 咖啡饮品</h2>
  </div>

  <!-- 这里放饮品的卡片 -->
  <div class="card"> ... </div>

    </div>

    <!-- 产品卡片：复制这一段修改 -->

    <div class="card">

    <div class="card">

  <div class="contact">

  </div>
</div>

<footer>
  © 2026 Meowcoco · 产品展示页
</footer>
<div class="modal" id="imageModal">
  <img id="modalImg" src="" alt="大图">
</div>
<script>
  const modal = document.getElementById('imageModal');
  const modalImg = document.getElementById('modalImg');
  
  // 给所有产品图片绑定点击事件
  document.querySelectorAll('.card img').forEach(img => {
    img.style.cursor = 'pointer'; // 鼠标移上去变成手型
    img.addEventListener('click', function() {
      modalImg.src = this.src;
      modal.classList.add('active');
    });
  });
  
  // 点击背景关闭弹窗
  modal.addEventListener('click', function() {
    this.classList.remove('active');
  });
</script>
</body> 
</html>
